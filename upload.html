<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fotos hochladen</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0b0f0a;color:#f7f7f3;margin:0;padding:24px;text-align:center}
    .card{max-width:560px;margin:0 auto;padding:26px;border-radius:18px;background:rgba(12,16,10,.9);border:1px solid rgba(255,255,255,.10)}
    h1{margin:0 0 10px 0}
    p{color:#c7c7c0}
    input{width:100%;margin:12px 0;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.40);color:#fff}
    button{padding:14px 22px;border-radius:999px;border:0;background:#6d8540;color:#fff;cursor:pointer;font-size:1rem}
    button:disabled{opacity:.6;cursor:not-allowed}
    .status{margin-top:14px;font-size:.95rem;color:#c7c7c0;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="card">
    <h1>Fotos hochladen 📸</h1>
    <p>Upload nur mit Passwort. Originalqualität bleibt erhalten.</p>

    <input id="pass" type="password" placeholder="Upload-Passwort" />
    <input id="files" type="file" accept="image/*" multiple />
    <button id="uploadBtn" type="button">Upload starten</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    const API_BASE = "https://vyspdptamoxxbwrcvjqa.supabase.co/functions/v1/wedding";

    const params = new URLSearchParams(location.search);
    const token = params.get("t") || "";

    const passEl = document.getElementById("pass");
    const filesEl = document.getElementById("files");
    const btn = document.getElementById("uploadBtn");
    const statusEl = document.getElementById("status");

    function setStatus(t){ statusEl.textContent = t; }

    btn.addEventListener("click", async () => {
      const pass = (passEl.value || "").trim();
      const files = Array.from(filesEl.files || []);

      if (!token) return setStatus("Ungültiger QR-Code (Parameter t fehlt).");
      if (!pass) return setStatus("Bitte Upload-Passwort eingeben.");
      if (!files.length) return setStatus("Bitte mindestens ein Foto auswählen.");

      btn.disabled = true;
      let done = 0;

      try {
        for (const file of files) {
          setStatus(`Vorbereiten… (${done}/${files.length})`);

          const initRes = await fetch(`${API_BASE}/init-upload?t=${encodeURIComponent(token)}`, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-upload-pass": pass
            },
            body: JSON.stringify({ fileName: file.name })
          });

          const initText = await initRes.text();
          let initJson = {};
          try { initJson = JSON.parse(initText); } catch {}

          if (!initRes.ok) {
            throw new Error(`init failed (${initRes.status}): ${initText}`);
          }

          const signedUrl = initJson.signedUrl;
          const objectPath = initJson.objectPath;
          if (!signedUrl || !objectPath) {
            throw new Error("init returned no signedUrl/objectPath");
          }

          setStatus(`Hochladen… (${++done}/${files.length})`);

          const upRes = await fetch(signedUrl, {
            method: "PUT",
            headers: { "content-type": file.type || "application/octet-stream" },
            body: file
          });

          if (!upRes.ok) {
            const t = await upRes.text().catch(() => "");
            throw new Error(`PUT failed (${upRes.status}): ${t}`);
          }

          const cRes = await fetch(`${API_BASE}/complete-upload?t=${encodeURIComponent(token)}`, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-upload-pass": pass
            },
            body: JSON.stringify({ objectPath })
          });

          const cText = await cRes.text();
          if (!cRes.ok) {
            throw new Error(`complete failed (${cRes.status}): ${cText}`);
          }
        }

        setStatus("Fertig! Die Fotos sind jetzt sofort in der Galerie sichtbar.");
      } catch (e) {
        setStatus("Fehler:\n" + (e?.message || String(e)));
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
