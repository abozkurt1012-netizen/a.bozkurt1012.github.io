<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fotos hochladen</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b0f0a;
      color: #f7f7f3;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 18px;
      background: rgba(12, 16, 10, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 { margin-top: 0; }
    input {
      width: 100%;
      margin: 16px 0;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.4);
      color: #fff;
    }
    button {
      padding: 14px 22px;
      border-radius: 999px;
      border: 0;
      background: #6d8540;
      color: white;
      cursor: pointer;
      font-size: 1rem;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #c7c7c0;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Fotos hochladen 📸</h1>
    <p>Bitte wähle deine Fotos aus. Die Originalqualität bleibt erhalten.</p>

    <input id="files" type="file" accept="image/*" multiple />
    <button id="uploadBtn">Upload starten</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    const API_BASE = "https://vyspdptamoxxbwrcvjqa.supabase.co/functions/v1/wedding";

    const params = new URLSearchParams(location.search);
    const token = params.get("t") || "";

    const filesInput = document.getElementById("files");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("uploadBtn");

    function setStatus(t) { statusEl.textContent = t; }

    btn.addEventListener("click", async () => {
      const files = Array.from(filesInput.files || []);
      if (!token) return setStatus("Ungültiger QR-Code.");
      if (!files.length) return setStatus("Bitte mindestens ein Foto auswählen.");

      btn.disabled = true;
      let done = 0;

      try {
        for (const file of files) {
          setStatus(`Vorbereiten… (${done}/${files.length})`);

          const initRes = await fetch(`${API_BASE}/init-upload?t=${encodeURIComponent(token)}`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ fileName: file.name })
          });

          if (!initRes.ok) throw new Error("init_failed");
          const { signedUrl, objectPath } = await initRes.json();

          setStatus(`Hochladen… (${++done}/${files.length})`);

          const upRes = await fetch(signedUrl, {
            method: "PUT",
            headers: { "content-type": file.type || "application/octet-stream" },
            body: file
          });

          if (!upRes.ok) throw new Error("upload_failed");

          await fetch(`${API_BASE}/complete-upload?t=${encodeURIComponent(token)}`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ objectPath })
          });
        }

        setStatus("Fertig! Danke – die Fotos erscheinen nach Freigabe.");
      } catch {
        setStatus("Fehler beim Upload. Bitte später erneut versuchen.");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
